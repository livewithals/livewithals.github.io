<!DOCTYPE html>
<html lang="en">
<head>{% include head.html %}</head>
<body>

  <!-- Mobile toggle button -->
  <button id="sidebar-toggle" class="mob-toggle" aria-label="Open navigation" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <!-- Sidebar -->
  {% include sidebar.html %}

  <!-- Main content area -->
  <div class="main">

    <div class="topbar">Website Last Updated on {{ site.last_updated }}</div>

    <!-- Hero image — set hero_image: filename.jpg in page frontmatter -->
    {% if page.hero_image %}
    <div class="hero">
      <img src="{{ '/assets/images/' | append: page.hero_image | relative_url }}"
           alt="{{ page.title }}"
           loading="lazy">
      <div class="hero-overlay"></div>
    </div>
    {% endif %}

    <div class="content-area">
      <header class="page-header">
        {% if page.eyebrow %}<span class="page-eyebrow">{{ page.eyebrow }}</span>{% endif %}
        <h1 class="page-title">{{ page.title }}</h1>
        <span class="page-rule"></span>
      </header>

      <div class="prose">
        {{ content }}
      </div>
    </div>

    {% include footer.html %}

  </div><!-- /.main -->

</body>
</html>
