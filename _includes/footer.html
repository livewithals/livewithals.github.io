<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-title">{{ site.title }}</div>
    <div class="footer-tagline">{{ site.tagline }}</div>
    <p>
      A caregiving resource for ALS families &nbsp;&bull;&nbsp;
      <a href="{{ site.url }}">www.livewithals.com</a>
    </p>
    <p class="footer-meta">
      Maintained by
      <a href="{{ site.author.url }}" target="_blank" rel="noopener">{{ site.author.name }}</a>
      &nbsp;&bull;&nbsp; Last updated: {{ site.last_updated }}
    </p>
  </div>
</footer>

<script>
(function () {
  const toggle   = document.getElementById('sidebar-toggle');
  const sidebar  = document.querySelector('.sidebar');
  const overlay  = document.getElementById('sidebar-overlay');

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('visible');
    toggle.classList.add('is-open');
    toggle.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden'; // prevent background scroll
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
    toggle.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  if (toggle) {
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
    });
  }

  if (overlay) {
    overlay.addEventListener('click', closeSidebar);
  }

  // Subnav expand/collapse (Research dropdown)
  document.querySelectorAll('.subnav-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const sub  = btn.closest('li').querySelector('.subnav');
      const open = sub.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
      btn.classList.toggle('rotated', open);
    });
  });

  // Close sidebar on nav link click (mobile)
  document.querySelectorAll('.sidenav a').forEach(function (link) {
    link.addEventListener('click', function () {
      if (window.innerWidth <= 768) closeSidebar();
    });
  });

})();
</script>
