<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-title">{{ site.title }}</div>
    <div class="footer-tagline">{{ site.tagline }}</div>
    <p>
      A caregiving resource for ALS families &nbsp;&bull;&nbsp;
      <a href="{{ site.url }}">www.livewithals.com</a>
    </p>
    <p class="footer-meta">
      Maintained by
      <a href="{{ site.author.url }}" target="_blank" rel="noopener">{{ site.author.name }}</a>
      &nbsp;&bull;&nbsp; Last updated: {{ site.last_updated }}
    </p>
  </div>
</footer>

<script>
  // Subnav expand/collapse
  document.querySelectorAll('.subnav-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const sub = btn.closest('li').querySelector('.subnav');
      const open = sub.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
      btn.classList.toggle('rotated', open);
    });
  });
  // Mobile sidebar
  const tog = document.getElementById('sidebar-toggle');
  const sb  = document.querySelector('.sidebar');
  if (tog && sb) {
    tog.addEventListener('click', () => sb.classList.toggle('open'));
    document.addEventListener('click', e => {
      if (!sb.contains(e.target) && !tog.contains(e.target))
        sb.classList.remove('open');
    });
  }
</script>
