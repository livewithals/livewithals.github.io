# =============================================
# Narula's ALS Diary — Jekyll Configuration
# =============================================

title: "Narula's ALS Diary"
tagline: "Life is Struggle & Struggle is Life"
description: >
  A family caregiving resource for ALS patients on invasive ventilation.
  Documenting our journey since 2016.
url: "https://www.livewithals.com"
baseurl: ""

author:
  name: "Harsh Kumar Narula"
  url: "http://harshkumarnarula.com"

last_updated: "March 12, 2026"

markdown: kramdown
highlighter: rouge
permalink: /:path/

kramdown:
  input: GFM
  math_engine: mathjax

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# -----------------------------------------------
# SIDEBAR NAVIGATION
# Add/remove/reorder pages here
# -----------------------------------------------
navigation:
  - title: "About"
    url: "/about/"
  - title: "Disclaimer"
    url: "/disclaimer/"
  - title: "Our ALS Story"
    url: "/our-als-story/"
  - title: "A Typical Day"
    url: "/a-typical-day/"
  - title: "Invasive Replacement"
    url: "/invasive-replacement/"
  - title: "Caregiving Hacks"
    url: "/caregiving-hacks/"
  - title: "Home ICU Setup"
    url: "/home-icu-setup/"
  - title: "Maintenance Schedule"
    url: "/maintenance-schedule/"
  - title: "Diet Pattern"
    url: "/diet-pattern/"
  - title: "Research"
    url: "/research/"
    children:
      - title: "When the Machine Lies"
        url: "/research/when-the-machine-lies/"
  - title: "Emergencies"
    url: "/emergencies/"
  - title: "FAQ"
    url: "/faq/"
  - title: "Gallery"
    url: "/gallery/"
  - title: "Contact Us"
    url: "/contact-us/"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Tell Jekyll to process _pages folder
collections:
  pages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
