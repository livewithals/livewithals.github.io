# ============================================================
# Narula's ALS Diary — Minimal Mistakes Jekyll Configuration
# ============================================================

remote_theme: mmistakes/minimal-mistakes@4.26.2

# ---- Skin ----
# Options: "default" | "dark" | "contrast" | "mint" | "sunrise" | "aqua" | "neon" | "plum"
minimal_mistakes_skin: "default"

# ---- Site Info ----
title: "Narula's ALS Diary"
title_separator: "—"
subtitle: "Life is Struggle & Struggle is Life"
name: "Harsh Kumar Narula"
description: >
  A family caregiving resource for ALS patients on invasive ventilation.
  Documenting our journey since 2016.
url: "https://www.livewithals.com"
baseurl: ""
repository: ""

# ---- Author ----
author:
  name: "Harsh Kumar Narula"
  bio: >
    Independent researcher and primary caregiver for his father, who has been
    on invasive tracheostomy ventilation since 2019. Runs livewithals.com.
  location: "Jaipur, India"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "http://harshkumarnarula.com"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@livewithals/about"

# ---- Footer links ----
footer:
  links:
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@livewithals/about"
    - label: "ALS Support India"
      icon: "fas fa-fw fa-heart"
      url: "https://linktr.ee/alscasindia"

# ---- Display options ----
show_date: false
read_time: false
words_per_minute: 160
comments:
  provider: false
search: true
search_full_content: true

# ---- MathJax ----
head_scripts:
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js

# ---- Build ----
markdown: kramdown
highlighter: rouge
permalink: /:path/
timezone: Asia/Kolkata

kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# ---- Plugins ----
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-include-cache

# ---- Collections ----
collections:
  pages:
    output: true
    permalink: /:path/

# ---- Defaults ----
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      sidebar:
        nav: "main"
      toc: true
      toc_label: "On this page"
      toc_sticky: true
  - scope:
      path: "index.md"
    values:
      layout: single
      author_profile: true
      sidebar:
        nav: "main"
      toc: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      sidebar:
        nav: "main"

# ---- Exclude from build ----
exclude:
  - README.md
  - Gemfile.lock
  - "*.zip"
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - vendor/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Disable top navigation bar entirely  
masthead_title: " "
